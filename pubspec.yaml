name: tiraz
description: "Tiraz — multi-brand jalabiya marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.0

  # Functional error handling
  dartz: ^0.10.1

  # Backend HTTP client
  dio: ^5.7.0

  # Secure JWT/session persistence
  flutter_secure_storage: ^9.2.2

  # Typography (IBM Plex Sans Arabic)
  google_fonts: ^6.2.1

  intl: any

  # Seller product photos — pick an existing image from the device
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
